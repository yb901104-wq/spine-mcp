<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><!--HOST_TOKEN-->
<title>AI Spine 动画工作区</title><link rel="stylesheet" href="/vendor/spine-player.css">
<style>
*{box-sizing:border-box}img:not([src]){display:none}body{margin:0;background:#151922;color:#e8edf5;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}main{display:grid;grid-template-columns:320px 1fr;min-height:100vh}aside{padding:20px;background:#202634;border-right:1px solid #354055}h1{font-size:20px}label{display:block;margin:18px 0 6px;color:#acb9cd}input,button{font:inherit;border:1px solid #435069;border-radius:5px;padding:9px;background:#293347;color:inherit}input{width:100%}button{cursor:pointer;margin:7px 4px 0 0}button:hover{background:#3a4862}#stage{display:flex;align-items:center;justify-content:center;padding:24px;position:relative}#frame{max-width:100%;image-rendering:auto}#status{white-space:pre-wrap;line-height:1.6;font-size:12px;overflow-wrap:anywhere;color:#bcc9db}#message{color:#facb81;white-space:pre-wrap}#player{position:fixed;left:0;top:0;width:960px;height:960px;pointer-events:none;opacity:0}small{color:#9daec7;line-height:1.6}
</style></head><body><main><aside><h1>AI Spine 动画工作区</h1><small>Agent 驱动编辑与审查。页面显示明确版本的实际结果；连接状态不代表动作已通过。</small>
<label for="document">工程内文档路径</label><input id="document" placeholder="例如 poses/standing.json"><button id="open">打开</button><button id="refresh">刷新画面</button>
<p id="message">等待显式打开工程或文档。</p><h2>创作检查</h2><pre id="quality" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><details><summary>连接与版本详情</summary><pre id="status"></pre><pre id="debug"></pre></details></aside><section id="stage" style="gap:12px;flex-wrap:wrap"><figure style="margin:0;max-width:30%"><figcaption>参考（原图坐标）</figcaption><img id="reference" alt="当前阶段参考" style="max-width:100%"></figure><figure style="margin:0;max-width:40%"><figcaption id="current-label">当前候选</figcaption><img id="frame" alt="当前文档所选帧的实际渲染"><div id="playback-view" style="width:480px;height:480px;max-width:100%" hidden></div><div id="playback-controls" hidden><button id="play-pause">播放</button><label for="play-time">本地播放时间（不产生批准）</label><input id="play-time" type="range" min="0" step="0.001" value="0"><output id="play-position">0.000s</output><label for="play-stage">关键姿态定位</label><select id="play-stage"><option value="">选择阶段</option></select><p id="play-binding" style="overflow-wrap:anywhere"></p></div></figure><figure style="margin:0;max-width:25%"><figcaption id="previous-label">前次候选（仅诊断对照）</figcaption><img id="previous" alt="前次候选" style="max-width:100%"></figure></section></main><div id="player"></div>
<script src="/vendor/spine-player.js"></script><script>
const token=document.querySelector('meta[name="x-spine-host-token"]').content,headers={'X-Spine-Host-Token':token};let state=null,player=null,lastEventId='',objectURL=null,pageActive=true;
const visibility=()=>pageActive?document.visibilityState:'hidden';
addEventListener('pagehide',()=>{pageActive=false;void fetch('/api/state',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({loaded:false,playing:false,visibilityState:'hidden'}),keepalive:true}).catch(()=>{});});
const status=document.getElementById('status'),message=document.getElementById('message');
let previousURL=null,previousKey=null,referenceURL=null,referenceKey=null,displayedVersion=null;
function showQuality(s){const q=s.creationQuality??{},yes=v=>v?'可以':'未就绪';document.getElementById('quality').textContent=[`阶段：${q.stageId??'未绑定参考阶段'}`,s.activeDoc?.memoryOnly?'内存诊断草稿（恢复记录不是正式资产）':s.activeDoc?'受管文档':'尚未载入文档',...(s.activeDoc?.memoryOnly?[`来源：${s.activeDoc.sourcePath}`,`拟保存路径：${s.activeDoc.proposedOutputPath}`]:[]),`继续编辑：${yes(q.canContinueEditing)}`,`参考关系：${q.referenceStatus??'未检查'}`,`进入审查：${yes(q.canReview)}`,`正式动画组装：${yes(q.canBuildFormalMotion)}`,`提交：${yes(q.canCommit)}`,`必要失败：${q.failureCount??0}`,...(q.methods??[]).map(p=>`${p.id??p.part??''}：${p.method} / ${p.reliability??'未知误差'}`),...(q.failures??[]).map(f=>`${f.id}：${f.status}\n${f.instruction}\n${f.nextAction?'下一步：'+f.nextAction.tool:'需复核证据或阶段定义'}`)].join('\n');}
async function showReference(s){const key=JSON.stringify([s.version,s.activeDoc?.referencePosePath]);if(key===referenceKey)return;referenceKey=key;if(referenceURL)URL.revokeObjectURL(referenceURL);referenceURL=null;document.getElementById('reference').removeAttribute('src');if(!s.version||!s.activeDoc?.referencePosePath)return;try{const r=await fetch('/api/reference-frame?'+new URLSearchParams(s.version),{headers});if(!r.ok)return;const b=await r.blob();if(referenceKey!==key)return;referenceURL=URL.createObjectURL(b);document.getElementById('reference').src=referenceURL;}catch{}}

function connectionLost(error){stopPlayback();message.textContent='连接不可用，仅显示最后诊断结果：'+error.message;const q=state?.creationQuality??{};showQuality({...state,creationQuality:{...q,canContinueEditing:false,canReview:false,canBuildFormalMotion:false,canCommit:false}});document.getElementById('current-label').textContent='离线诊断 · 修订 '+(displayedVersion?.revision??'—');}
async function showPrevious(s){const key=JSON.stringify([s.version,s.previousFrame]);if(key===previousKey)return;previousKey=key;if(previousURL)URL.revokeObjectURL(previousURL);previousURL=null;const el=document.getElementById('previous');el.removeAttribute('src');if(!s.version||!s.previousFrame?.available)return;try{const r=await fetch('/api/previous-frame?'+new URLSearchParams(s.version),{headers});if(!r.ok)return;const b=await r.blob();if(previousKey!==key)return;previousURL=URL.createObjectURL(b);el.src=previousURL;document.getElementById('previous-label').textContent='前次诊断 · 修订 '+s.previousFrame.version.revision;}catch{}}

let refreshPending=null,refreshAgain=false,frameRequested=false,forceFrameRequested=false,displayedFrameKey=null;
function refresh(refreshFrame=true,forceFrame=false){frameRequested ||=refreshFrame;forceFrameRequested ||=forceFrame;if(refreshPending){refreshAgain=true;return refreshPending;}refreshPending=(async()=>{do{refreshAgain=false;const frame=frameRequested,force=forceFrameRequested;frameRequested=false;forceFrameRequested=false;await refreshOnce(frame,force);}while(refreshAgain);})().finally(()=>{refreshPending=null;});return refreshPending;}
function evaluationStatus(tasks){const active=tasks?.active??[];if(active.some(task=>task.status==='unresponsive'))return '状态待核对（求解心跳失联）';if(active.length)return `计算中（${active.length}）`;return ({succeeded:'已完成',failed:'失败，请检查报告',cancelled:'已取消'})[tasks?.recent?.at(-1)?.status]??'尚未登记';}
function viewingStatus(doc){if(!doc)return '尚未选择';if(doc.kind==='pose')return '单姿态';if(!doc.view)return '仅结构（未选择动画/时间）';return `${doc.view.animation===null?'setup pose':doc.view.animation} · ${doc.view.time}s`;}
async function api(url,body){const r=await fetch(url,{headers:{...headers,...(body?{'Content-Type':'application/json'}:{})},...(body?{method:'POST',body:JSON.stringify(body)}:{})});const v=await r.json();if(!r.ok)throw Error(`${v.code}: ${v.message}`);return v;}
function clearFrame(clearHistory=true){stopPlayback(true);if(clearHistory){previousKey=null;if(previousURL)URL.revokeObjectURL(previousURL);previousURL=null;displayedVersion=null;document.getElementById('previous').removeAttribute('src');document.getElementById('previous-label').textContent='前次候选（仅诊断对照）';}if(objectURL)URL.revokeObjectURL(objectURL);objectURL=null;displayedFrameKey=null;document.getElementById('frame').removeAttribute('src');}
async function refreshOnce(refreshFrame=true,forceFrame=false){state=await api('/api/state');showQuality(state);void showReference(state);void showPrevious(state);status.textContent=[`工程：${state.project?.name??(state.project?.mode==='managed'?'已加载工程':'尚未打开')}`,`文档：${state.activeDoc?.path??'尚未选择'}`,`呈现：${viewingStatus(state.activeDoc)}`,`当前修订：${state.version?.revision??'—'}`,`写入：${state.writeMode==='observer'?'仅观察':state.writeMode==='attached'?'已取得写入权':'冻结'}`,`观察记录：${state.observation?.error?'记录异常，请检查报告':state.observation?.running?`采集中（${state.observation.samples} 次）`:'未启动'}`,`资源：${state.targetStale?'已变化，需要处理':'与当前版本一致'}`,`求解任务：${evaluationStatus(state.evaluationTasks)}`,`数值：${state.numeric?.ok===true?'通过':state.numeric?.ok===false?'未通过':state.numeric?.status==='previewOnly'?'仅采样观察，未完成动画验收':'尚未计算'}`,`Canvas 回归：${({passed:'通过',failed:'未通过',unverified:'未验证'})[state.capture?.rendererParity?.status]??'未验证'}`,`Player 截图：${state.capture?.captureValidity?.status==='verified'?'核验通过':state.capture?'核验不通过':'尚未采集'}`,`截图准入：${state.capture?.evidenceEligible===true?'可进入视觉审查':state.capture?'仅诊断':'尚未判定'}`,`视觉审查：${state.agentVisual?.status==='approved'?'已记录批准':'尚未通过'}`,`编辑器导入：${state.editorImport?.status==='passed'?'通过':'尚未验证'}`].join('\n');document.getElementById('debug').textContent=JSON.stringify({activeDoc:state.activeDoc,pinned:state.pinned,derivedHash:state.derivedHash,evaluationTasks:state.evaluationTasks,observation:state.observation,rollout:state.rollout},null,2);if(displayedVersion&&(displayedVersion.documentId!==state.version?.documentId||displayedVersion.openEpoch!==state.version?.openEpoch))clearFrame();if(!state.version){clearFrame();return;}void syncPlayback(state).catch(e=>{stopPlayback(true);message.textContent=e.message;});if(!refreshFrame)return;const frameKey=JSON.stringify([state.version,state.derivedHash,state.dependencyFingerprint]);if(!forceFrame&&!state.targetStale&&displayedFrameKey===frameKey)return;
try{const q=new URLSearchParams({...state.version,size:480}),r=await fetch('/api/frame?'+q,{headers});if(!r.ok){const e=await r.json();throw Error(`${e.code}: ${e.message}`);}const b=await r.blob();if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(b);displayedVersion=structuredClone(state.version);document.getElementById('current-label').textContent=(state.activeDoc?.memoryOnly?'内存诊断草稿':'当前候选')+' · 修订 '+state.version.revision;document.getElementById('frame').src=objectURL;displayedFrameKey=frameKey;message.textContent=`版本 ${state.version.revision} · ${state.derivedHash?.slice(0,12)??'待重算'}`;}catch(e){clearFrame(false);message.textContent=e.message;}}
document.getElementById('open').onclick=async()=>{try{const path=document.getElementById('document').value;await api('/api/open',{path, ...(state?.version?{expectedRevision:state.version}:{})});await refresh();}catch(e){message.textContent=e.message;}};
document.getElementById('refresh').onclick=()=>refresh(true,true).catch(e=>message.textContent=e.message);

let playbackPlayer=null,playbackKey=null,playbackGeneration=0,localPlaying=false,playbackDuration=0,playbackBundle=null;
const playTime=document.getElementById('play-time'),playButton=document.getElementById('play-pause');
function stopPlayback(dispose=false){localPlaying=false;playButton.textContent='播放';playbackPlayer?.pause();if(dispose){playbackGeneration++;playbackPlayer?.dispose();playbackPlayer=null;playbackKey=null;playbackBundle=null;document.getElementById('playback-view').innerHTML='';document.getElementById('playback-view').hidden=true;document.getElementById('playback-controls').hidden=true;document.getElementById('frame').hidden=false;}}
function localSeek(time){stopPlayback();if(!playbackPlayer||!playbackBundle)return;const t=Math.max(0,Math.min(playbackDuration,Number(time)));playbackPlayer.animationState.clearTracks();playbackPlayer.skeleton.setToSetupPose();const track=playbackPlayer.animationState.setAnimation(0,playbackBundle.animation,false);track.trackTime=t;playbackPlayer.animationState.apply(playbackPlayer.skeleton);playbackPlayer.skeleton.updateWorldTransform();playTime.value=t;document.getElementById('play-position').textContent=t.toFixed(3)+'s';}
async function syncPlayback(s){if(!s.playback||s.targetStale||!s.playback.animation){if(playbackKey)stopPlayback(true);return;}
 const key=JSON.stringify([s.version,s.playback.candidateHash,s.playback.camera]);if(key===playbackKey)return;stopPlayback(true);const generation=playbackGeneration;playbackKey=key;
 const b=await api('/api/playback-bundle?'+new URLSearchParams({...s.version,candidateHash:s.playback.candidateHash}));if(generation!==playbackGeneration)return;
 if(JSON.stringify(b.version)!==JSON.stringify(s.version)||b.candidateHash!==s.playback.candidateHash)throw Error('播放包已过期，请重新查询。');
 document.getElementById('playback-view').hidden=false;
 const p=await new Promise((resolve,reject)=>new spine.SpinePlayer('playback-view',{jsonUrl:'pose.json',atlasUrl:'atlas.atlas',rawDataURIs:b.rawDataURIs,animation:b.animation,skin:b.skin??undefined,premultipliedAlpha:b.pma,mipmaps:false,showControls:false,showLoading:false,backgroundColor:'#20242b',viewport:{x:b.camera.minX,y:b.camera.minY,width:b.camera.maxX-b.camera.minX,height:b.camera.maxY-b.camera.minY,padLeft:0,padRight:0,padTop:0,padBottom:0,transitionTime:0},success:resolve,error:(_p,m)=>reject(Error(m))}));
 if(generation!==playbackGeneration){p.dispose();return;}playbackPlayer=p;playbackBundle=b;playbackDuration=b.duration;playTime.max=b.duration;document.getElementById('frame').hidden=true;document.getElementById('playback-controls').hidden=false;
 const select=document.getElementById('play-stage');select.replaceChildren(new Option('选择阶段',''));for(const stage of b.stages)select.add(new Option(stage.stageId+' · '+stage.time+'s',String(stage.time)));
 document.getElementById('play-binding').textContent='播放绑定：修订 '+b.version.revision+' / '+b.candidateHash.slice(0,12)+' / '+b.animation+'。截图须由 MCP 暂停并核验明确时间。';localSeek(b.time);
}
playTime.oninput=()=>localSeek(playTime.value);document.getElementById('play-stage').onchange=e=>{if(e.target.value!=='')localSeek(e.target.value);};playButton.onclick=()=>{if(!playbackPlayer)return;if(localPlaying){stopPlayback();return;}if(Number(playTime.value)>=playbackDuration)localSeek(0);localPlaying=true;playButton.textContent='暂停';playbackPlayer.play();};
function playbackTick(){if(localPlaying&&playbackPlayer){const t=Math.min(playbackDuration,playbackPlayer.animationState.getCurrent(0)?.trackTime??0);playTime.value=t;document.getElementById('play-position').textContent=t.toFixed(3)+'s';if(t>=playbackDuration)stopPlayback();}requestAnimationFrame(playbackTick);}requestAnimationFrame(playbackTick);
document.addEventListener('visibilitychange',()=>{if(visibility()!=='visible')stopPlayback();});

const raf=()=>new Promise(resolve=>requestAnimationFrame(resolve));
async function capture(task){
stopPlayback();
let result={captureId:task.id,visibilityState:visibility()};
try{
 if(visibility()!=='visible')throw Error('页面在后台或已卸载，停止截图。');
 const b=await api('/api/player-bundle?captureId='+encodeURIComponent(task.id));
 if(player)player.dispose();const element=document.getElementById('player');element.innerHTML='';element.style.width=b.size+'px';element.style.height=b.size+'px';element.style.opacity='1';
 player=await new Promise((resolve,reject)=>new spine.SpinePlayer('player',{jsonUrl:'pose.json',atlasUrl:'atlas.atlas',rawDataURIs:b.rawDataURIs,animation:b.animation,skin:b.skin??undefined,premultipliedAlpha:b.pma,mipmaps:false,showControls:false,showLoading:false,preserveDrawingBuffer:true,backgroundColor:'#20242b',viewport:{x:b.camera.minX,y:b.camera.minY,width:b.camera.maxX-b.camera.minX,height:b.camera.maxY-b.camera.minY,padLeft:0,padRight:0,padTop:0,padBottom:0,transitionTime:0},success:resolve,error:(_p,m)=>reject(Error(m))}));
 player.pause();player.animationState.clearTracks();player.skeleton.setToSetupPose();if(b.animation!==null){const track=player.animationState.setAnimation(0,b.animation,false);track.trackTime=b.time;player.animationState.apply(player.skeleton);}player.skeleton.updateWorldTransform();await raf();await raf();
 if(visibility()!=='visible')throw Error('摆帧期间页面进入后台或已卸载。');
 const target=player.canvas;target.width=b.size;target.height=b.size;await raf();await raf();
 const vertices={};for(const slot of player.skeleton.slots){const a=slot.getAttachment();if(!a)continue;if(a.worldVerticesLength!==undefined){const v=new Array(a.worldVerticesLength).fill(0);a.computeWorldVertices(slot,0,v.length,v,0,2);vertices[slot.data.name+':'+a.name]=v;}else if(a instanceof spine.RegionAttachment){const v=new Array(8).fill(0);a.computeWorldVertices(slot,v,0,2);vertices[slot.data.name+':'+a.name]=v;}}
 const sha=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),v=>v.toString(16).padStart(2,'0')).join('');
 const resourceHashes={};for(const[name,uri]of Object.entries(b.rawDataURIs))resourceHashes[name]=await sha(Uint8Array.from(atob(uri.split(',')[1]),c=>c.charCodeAt(0)));
 const playerScriptHash=await sha(await(await fetch('/vendor/spine-player.js')).arrayBuffer());
 const camera=player.sceneRenderer.camera;
 result={...result,visibilityState:visibility(),pngBase64:target.toDataURL('image/png').split(',')[1],viewport:b.viewport,dpr:window.devicePixelRatio,resourceHashes,playerScriptHash,actualCamera:{x:camera.position.x,y:camera.position.y,zoom:camera.zoom,viewportWidth:camera.viewportWidth,viewportHeight:camera.viewportHeight},actual:{skin:player.skeleton.skin?.name??null,bones:player.skeleton.bones.map(b=>[b.data.name,b.worldX,b.worldY,b.a,b.b,b.c,b.d]),vertices,attachments:player.skeleton.slots.map(s=>[s.data.name,s.getAttachment()?.name??null]),drawOrder:player.skeleton.drawOrder.map(s=>s.data.name)},pma:b.pma};
}catch(e){result.error=e.message;}try{await api('/api/capture',result);}catch(e){message.textContent=e.message;}finally{document.getElementById('player').style.opacity='0';}}
async function events(){while(true){try{const response=await fetch('/api/events',{headers:{...headers,...(lastEventId?{'Last-Event-ID':lastEventId}:{})}});if(!response.ok)throw Error('事件连接失败');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const{done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let index;while((index=buffer.indexOf('\n\n'))>=0){const block=buffer.slice(0,index);buffer=buffer.slice(index+2);const type=block.match(/^event: (.+)$/m)?.[1],data=block.match(/^data: (.+)$/m)?.[1],id=block.match(/^id: (.+)$/m)?.[1];if(id)lastEventId=id;if(type==='capture-request'&&data)void capture(JSON.parse(data));else if(type)void refresh(!['evaluation-task-updated','observation-updated'].includes(type));}}}catch(e){connectionLost(e);}await new Promise(r=>setTimeout(r,1000));}}
setInterval(()=>{if(pageActive){void api('/api/state',{heartbeat:true,loaded:!!player,playing:localPlaying,visibilityState:visibility()}).catch(()=>{});if(state?.evaluationTasks?.active?.length)void refresh(false).catch(connectionLost);}},1000);void refresh().catch(connectionLost);void events();
</script></body></html>
